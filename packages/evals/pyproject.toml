[project]
name = "askindia-evals"
version = "0.1.0"
description = "Evaluation harnesses: execution accuracy, verdict accuracy, judges."
requires-python = ">=3.12,<3.13"
dependencies = [
    "askindia-agents",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askindia_evals"]

[tool.uv.sources]
askindia-agents = { workspace = true }
