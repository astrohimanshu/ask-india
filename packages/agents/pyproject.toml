[project]
name = "askindia-agents"
version = "0.1.0"
description = "LangGraph agent: schema retrieval, SQL generation, execution, guards."
requires-python = ">=3.12,<3.13"
dependencies = [
    "litellm>=1.50",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlglot>=25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askindia_agents"]
