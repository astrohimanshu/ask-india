[project]
name = "askindia-ingestion"
version = "0.1.0"
description = "Dataset loaders, validation, and versioned persistence."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pyyaml>=6",
    "xlrd>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askindia_ingestion"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "types-pyyaml>=6.0.12.20260815",
]
