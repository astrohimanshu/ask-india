dataset: imd_subdivision_rainfall
templates:
  - id: annual_rainfall
    complexity: filter
    questions:
      - "What was the annual rainfall in {subdivision} in {year}?"
      - "How much rain did {subdivision} receive in {year} in total?"
      - "{subdivision} total rainfall {year}"
    sql: >-
      SELECT rainfall_mm FROM data.imd_subdivision_rainfall
      WHERE subdivision = '{subdivision}' AND year = {year} AND month = 'Annual'
    params:
      subdivision: {kind: column, source: data.imd_subdivision_rainfall.subdivision}
      year: {kind: years, start: 1950, end: 2024}
  - id: monthly_rainfall
    complexity: filter
    questions:
      - "How much rain fell in {subdivision} in {month} {year}?"
      - "{subdivision} rainfall for {month} {year}"
    sql: >-
      SELECT rainfall_mm FROM data.imd_subdivision_rainfall
      WHERE subdivision = '{subdivision}' AND year = {year} AND month = '{month}'
    params:
      subdivision: {kind: column, source: data.imd_subdivision_rainfall.subdivision}
      year: {kind: years, start: 1950, end: 2024}
      month: {kind: list, values: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]}
  - id: monsoon_total
    complexity: group
    questions:
      - "How much rain did {subdivision} get in the {year} monsoon (June to September)?"
      - "{subdivision} southwest monsoon rainfall in {year}"
      - "Total June–September rainfall for {subdivision}, {year}"
    sql: >-
      SELECT SUM(rainfall_mm) AS monsoon_rain_mm, SUM(normal_mm) AS normal_mm
      FROM data.imd_subdivision_rainfall
      WHERE subdivision = '{subdivision}' AND year = {year} AND month IN ('Jun', 'Jul', 'Aug', 'Sep')
    params:
      subdivision: {kind: column, source: data.imd_subdivision_rainfall.subdivision}
      year: {kind: years, start: 1950, end: 2024}
  - id: departure_from_normal
    complexity: derived
    questions:
      - "By what percentage was {month} {year} rainfall in {subdivision} above or below normal?"
      - "Rainfall departure from normal for {subdivision} in {month} {year}"
    sql: >-
      SELECT rainfall_mm, normal_mm, ROUND((rainfall_mm - normal_mm) * 100.0 / normal_mm, 1) AS departure_pct
      FROM data.imd_subdivision_rainfall
      WHERE subdivision = '{subdivision}' AND year = {year} AND month = '{month}' AND normal_mm > 0
    params:
      subdivision: {kind: column, source: data.imd_subdivision_rainfall.subdivision}
      year: {kind: years, start: 1950, end: 2024}
      month: {kind: list, values: [Jun, Jul, Aug, Sep, Annual]}
  - id: wettest_year
    complexity: rank
    questions:
      - "Which was the wettest year on record for {subdivision}?"
      - "Year with the most rainfall in {subdivision}"
    sql: >-
      SELECT year, rainfall_mm FROM data.imd_subdivision_rainfall
      WHERE subdivision = '{subdivision}' AND month = 'Annual' AND rainfall_mm IS NOT NULL
      ORDER BY rainfall_mm DESC LIMIT 1
    params:
      subdivision: {kind: column, source: data.imd_subdivision_rainfall.subdivision}
  - id: driest_year_since
    complexity: rank
    questions:
      - "What was the driest year for {subdivision} since {year}?"
      - "Lowest annual rainfall in {subdivision} from {year} onwards"
    sql: >-
      SELECT year, rainfall_mm FROM data.imd_subdivision_rainfall
      WHERE subdivision = '{subdivision}' AND month = 'Annual' AND year >= {year} AND rainfall_mm IS NOT NULL
      ORDER BY rainfall_mm ASC LIMIT 1
    params:
      subdivision: {kind: column, source: data.imd_subdivision_rainfall.subdivision}
      year: {kind: list, values: ["1980", "1990", "2000", "2010"]}
  - id: wettest_subdivision_in_year
    complexity: rank
    questions:
      - "Which subdivision received the most rainfall in {year}?"
      - "Wettest meteorological subdivision of India in {year}"
    sql: >-
      SELECT subdivision, rainfall_mm FROM data.imd_subdivision_rainfall
      WHERE year = {year} AND month = 'Annual' ORDER BY rainfall_mm DESC NULLS LAST LIMIT 1
    params:
      year: {kind: years, start: 1950, end: 2024}
  - id: top_subdivisions_month
    complexity: rank
    questions:
      - "Which {n} subdivisions got the most rain in {month} {year}?"
      - "Top {n} subdivisions by rainfall, {month} {year}"
    sql: >-
      SELECT subdivision, rainfall_mm FROM data.imd_subdivision_rainfall
      WHERE year = {year} AND month = '{month}' ORDER BY rainfall_mm DESC NULLS LAST LIMIT {n}
    params:
      n: {kind: list, values: ["3", "5"]}
      year: {kind: years, start: 1990, end: 2024}
      month: {kind: list, values: [Jun, Jul, Aug, Sep]}
  - id: decade_average
    complexity: group
    questions:
      - "What was the average annual rainfall in {subdivision} between {year1} and {year2}?"
      - "Mean yearly rainfall for {subdivision}, {year1}–{year2}"
    sql: >-
      SELECT ROUND(AVG(rainfall_mm), 1) AS avg_annual_mm FROM data.imd_subdivision_rainfall
      WHERE subdivision = '{subdivision}' AND month = 'Annual' AND year BETWEEN {year1} AND {year2}
    params:
      subdivision: {kind: column, source: data.imd_subdivision_rainfall.subdivision}
      year1: {kind: list, values: ["1981", "1991", "2001", "2011"]}
      year2: {kind: list, values: ["2010", "2020", "2024"]}
  - id: annual_trend
    complexity: group
    questions:
      - "What was the annual rainfall in {subdivision} each year from {year1} to {year2}?"
      - "Year by year rainfall in {subdivision}, {year1} to {year2}"
    sql: >-
      SELECT year, rainfall_mm, normal_mm FROM data.imd_subdivision_rainfall
      WHERE subdivision = '{subdivision}' AND month = 'Annual' AND year BETWEEN {year1} AND {year2} ORDER BY year
    params:
      subdivision: {kind: column, source: data.imd_subdivision_rainfall.subdivision}
      year1: {kind: list, values: ["2010", "2015", "2018"]}
      year2: {kind: list, values: ["2022", "2024"]}
  - id: years_above_normal
    complexity: group
    questions:
      - "In how many years since {year} was annual rainfall above normal in {subdivision}?"
      - "Count of above-normal rainfall years in {subdivision} from {year}"
    sql: >-
      SELECT COUNT(*) AS years_above_normal FROM data.imd_subdivision_rainfall
      WHERE subdivision = '{subdivision}' AND month = 'Annual' AND year >= {year} AND rainfall_mm > normal_mm
    params:
      subdivision: {kind: column, source: data.imd_subdivision_rainfall.subdivision}
      year: {kind: list, values: ["1990", "2000", "2010"]}
  - id: compare_two_subdivisions
    complexity: group
    questions:
      - "Which got more rain in {year}, {subdivision} or {subdivision2}?"
      - "Compare annual rainfall of {subdivision} and {subdivision2} in {year}"
    sql: >-
      SELECT subdivision, rainfall_mm FROM data.imd_subdivision_rainfall
      WHERE subdivision IN ('{subdivision}', '{subdivision2}') AND year = {year} AND month = 'Annual'
      ORDER BY rainfall_mm DESC
    params:
      subdivision: {kind: column, source: data.imd_subdivision_rainfall.subdivision}
      subdivision2: {kind: list, values: ["Kerala and Mahe", "Punjab", "Vidarbha", "Bihar", "Gujarat Region", "Tamil Nadu Puducherry and Karaikal"]}
      year: {kind: years, start: 1990, end: 2024}
