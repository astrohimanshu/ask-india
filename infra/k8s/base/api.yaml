apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        - name: migrate
          image: ghcr.io/astrohimanshu/ask-india-api:dev
          command: ["python", "-m", "askindia_ingestion.migrate"]
          envFrom:
            - secretRef:
                name: askindia-secrets
            - configMapRef:
                name: askindia-config
      containers:
        - name: api
          image: ghcr.io/astrohimanshu/ask-india-api:dev
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: askindia-secrets
            - configMapRef:
                name: askindia-config
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 2Gi }
