# Local kind cluster: images are loaded with `kind load docker-image`, the API reaches the host's
# Ollama at the kind network gateway (address generated into ollama.env), and services are exposed
# as NodePorts mapped in kind.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: askindia
resources:
  - ../../base
configMapGenerator:
  - name: db-init-sql
    files:
      - init_db.sql=../../../../scripts/db/sql/init_db.sql
      - seed.sql=../../../../scripts/db/sql/seed.sql
  - name: askindia-config
    envs:
      - ollama.env   # generated by scripts/kind_up.sh: OLLAMA_BASE_URL at the kind gateway
    literals:
      - SQL_MODEL=ollama/qwen2.5-coder:7b
      - CHAT_MODEL=ollama/qwen2.5:7b-instruct
      - WEB_ORIGIN=http://localhost:30300
      - LANGFUSE_BASE_URL=https://cloud.langfuse.com
secretGenerator:
  - name: askindia-secrets
    envs:
      - secrets.env   # generated by scripts/kind_up.sh from the development .env; never committed
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Service
      name: api
    patch: |
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30800
  - target:
      kind: Service
      name: web
    patch: |
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30300
