# Local development stack. Paths are relative to the repository root; run from there with
#   docker compose --project-directory . -f infra/compose/compose.yaml up -d
# Ollama runs as a native host process (scripts/dev_ollama.sh); Langfuse is the hosted service.
name: askindia

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-askindia}
      ASKINDIA_APP_PASSWORD: ${ASKINDIA_APP_PASSWORD:?set ASKINDIA_APP_PASSWORD in .env}
      ASKINDIA_RO_PASSWORD: ${ASKINDIA_RO_PASSWORD:?set ASKINDIA_RO_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - log_min_duration_statement=2000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-askindia}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Observability (opt in): docker compose --profile observability up -d
  # Both use the host network: the API listens on the host loopback and the host firewall does
  # not admit the docker bridge, so bridge-networked scrapers cannot reach it. Ports stay local
  # because the firewall only exposes SSH.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-askindia}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/compose/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
