# Local development stack. Paths are relative to the repository root; run from there with
#   docker compose --project-directory . -f infra/compose/compose.yaml up -d
# Ollama runs as a native host process (scripts/dev_ollama.sh); Langfuse is the hosted service.
name: askindia

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-askindia}
      ASKINDIA_APP_PASSWORD: ${ASKINDIA_APP_PASSWORD:?set ASKINDIA_APP_PASSWORD in .env}
      ASKINDIA_RO_PASSWORD: ${ASKINDIA_RO_PASSWORD:?set ASKINDIA_RO_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - log_min_duration_statement=2000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-askindia}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
